name: Apply Points v13 session fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/points-v13-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch session experience
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('session-copy.js')
          s = path.read_text()

          old_css = '''    .panel{
      width:min(560px,100%);
      border:1px solid var(--line);
      border-right:0;
      transition:
        transform .32s cubic-bezier(.22,.9,.32,1),
        border-color var(--breath-duration,4000ms) ease,
        box-shadow var(--breath-duration,4000ms) ease;
    }
    .panel.breath-in{
      border-color:rgba(78,93,75,.50);
      box-shadow:-18px 0 44px rgba(43,42,38,.11), inset 0 0 0 2px rgba(78,93,75,.10);
    }
    .panel.breath-hold{
      border-color:rgba(169,136,79,.44);
      box-shadow:-18px 0 44px rgba(43,42,38,.10), inset 0 0 0 2px rgba(169,136,79,.08);
    }
    .panel.breath-out{
      border-color:rgba(228,223,211,.92);
      box-shadow:-14px 0 34px rgba(43,42,38,.08), inset 0 0 0 1px rgba(78,93,75,.025);
    }'''

          new_css = '''    .panel{
      width:min(560px,100%);
      border:1px solid var(--line);
      border-right:0;
      overflow-anchor:none;
      box-shadow:-14px 0 34px rgba(43,42,38,.08), inset 0 0 0 2px rgba(228,223,211,.40);
      transition:
        transform .32s cubic-bezier(.22,.9,.32,1),
        box-shadow var(--breath-duration,4000ms) cubic-bezier(.37,0,.63,1);
    }
    .panel.breath-in{
      box-shadow:-18px 0 42px rgba(43,42,38,.10), inset 0 0 0 4px rgba(58,70,56,.58), inset 0 0 34px rgba(78,93,75,.055);
    }
    .panel.breath-hold{
      box-shadow:-18px 0 42px rgba(43,42,38,.10), inset 0 0 0 4px rgba(58,70,56,.58), inset 0 0 34px rgba(78,93,75,.055);
    }
    .panel.breath-out{
      box-shadow:-14px 0 34px rgba(43,42,38,.08), inset 0 0 0 2px rgba(228,223,211,.40), inset 0 0 0 rgba(78,93,75,0);
    }'''

          if old_css not in s:
              raise SystemExit('Expected breathing CSS block not found')
          s = s.replace(old_css, new_css, 1)
          s = s.replace('''    .script-box{
      max-height:none!important;
      overflow:visible!important;''', '''    .script-box{
      max-height:none!important;
      overflow:visible!important;
      overflow-anchor:none;''', 1)

          start = s.index('  function slowScrollTo(el, target, duration = 2200){')
          end = s.index('\n\n  // Move the breathing animation from the circle to the session panel border.', start)

          new_scroll = '''  let sessionScrollFrame = null;

  function cancelSessionScroll(){
    if(sessionScrollFrame !== null){
      cancelAnimationFrame(sessionScrollFrame);
      sessionScrollFrame = null;
    }
  }

  function slowScrollTo(el, target, duration = 2100){
    cancelSessionScroll();
    const start = el.scrollTop;
    const max = Math.max(0, el.scrollHeight - el.clientHeight);
    const end = Math.max(start, Math.min(target, max));
    const distance = end - start;
    if(distance < 2) return;

    const started = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    const step = (now) => {
      const progress = Math.min(1, (now - started) / duration);
      el.scrollTop = start + distance * ease(progress);
      if(progress < 1){
        sessionScrollFrame = requestAnimationFrame(step);
      }else{
        sessionScrollFrame = null;
      }
    };
    sessionScrollFrame = requestAnimationFrame(step);
  }

  panel.addEventListener('touchstart', cancelSessionScroll, { passive:true });
  panel.addEventListener('wheel', cancelSessionScroll, { passive:true });

  // Replace passage reveal with a slow fade and one forward-only auto-follow motion.
  advanceSession = function(state){
    if(state.index >= state.paragraphs.length){
      cancelSessionScroll();
      state.statusEl.textContent = 'Session complete';
      state.playing = false;
      state.btnEl.textContent = '↺';
      stopBreathingLoop();
      chime();
      showReflection();
      return;
    }

    const p = document.createElement('p');
    p.textContent = state.paragraphs[state.index];
    p.style.opacity = '0';
    p.style.transform = 'translateY(6px)';
    p.style.transition = 'opacity 4.2s cubic-bezier(.22,.7,.25,1), transform 4.2s cubic-bezier(.22,.7,.25,1)';
    state.boxEl.appendChild(p);

    requestAnimationFrame(() => requestAnimationFrame(() => {
      p.style.opacity = '1';
      p.style.transform = 'translateY(0)';

      const panelRect = panel.getBoundingClientRect();
      const paragraphRect = p.getBoundingClientRect();
      const readingLine = panelRect.bottom - Math.min(150, panel.clientHeight * .22);
      if(paragraphRect.bottom > readingLine){
        const delta = paragraphRect.bottom - readingLine;
        slowScrollTo(panel, panel.scrollTop + delta + 24, 2100);
      }
    }));

    const progress = state.index / Math.max(1, state.paragraphs.length - 1);
    state.statusEl.textContent = progress < 0.22
      ? 'Beginning…'
      : progress < 0.62
        ? 'Settling in…'
        : progress < 0.88
          ? 'Take your time…'
          : 'Stay with this…';

    const dur = readingDuration(state.paragraphs[state.index], state.paceMultiplier);
    state.index++;
    if(state.playing){
      state.timer = setTimeout(() => advanceSession(state), dur);
    }
  };'''

          s = s[:start] + new_scroll + s[end:]
          path.write_text(s)

          sw = Path('service-worker.js')
          w = sw.read_text()
          w = w.replace("const CACHE_NAME = 'points-shell-v12';", "const CACHE_NAME = 'points-shell-v13';")
          w = w.replace("'./session-copy.js?v=12'", "'./session-copy.js?v=13'")
          w = w.replace('<script src="./session-copy.js?v=12"></script>', '<script src="./session-copy.js?v=13"></script>')
          sw.write_text(w)
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add session-copy.js service-worker.js
          git commit -m "Fix Points session scroll and breathing perimeter"
          git push
