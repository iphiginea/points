name: Apply visual polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Polish orientation, hierarchy, and point styling
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  <p>Each point on the map holds a session — settle in, choose what you're carrying today, and let the point guide the focus.</p>",
                  "  <p>12 points, each connected to a feeling or state. Choose what feels closest today.</p>"
              ),
              (
                  '    <div class="eyebrow">Select a point</div>',
                  '    <div class="eyebrow">What are you carrying today?</div>\n    <div class="figure-guide">Tap a point on the body or choose below.</div>'
              ),
              (
                  '  .figure-wrap .eyebrow{margin-bottom:14px;}',
                  "  .figure-wrap .eyebrow{margin-bottom:6px;}\n  .figure-guide{\n    margin-bottom:14px;\n    color:var(--ink-faint);\n    font-size:12px;\n    line-height:1.45;\n    text-align:center;\n  }"
              ),
              (
                  '    opacity:0.18;\n    animation:pulse 3.6s ease-in-out infinite;',
                  '    opacity:0.13;\n    animation:pulse 5.2s ease-in-out infinite;'
              ),
              (
                  '    box-shadow:0 1px 3px rgba(43,42,38,0.2);\n  }',
                  '    box-shadow:0 1px 3px rgba(43,42,38,0.2);\n    transition:background .2s ease, transform .2s ease;\n  }'
              ),
              (
                  '  .point.active .halo{\n    background:var(--sage);\n    opacity:0.24;\n  }',
                  '  .point.active .halo{\n    background:var(--sage);\n    opacity:0.26;\n  }\n  .point.active .core{ transform:scale(1.16); }'
              ),
              (
                  '    0%,100%{ transform:scale(1); opacity:0.18; }\n    50%{ transform:scale(1.35); opacity:0.05; }',
                  '    0%,100%{ transform:scale(1); opacity:0.13; }\n    50%{ transform:scale(1.18); opacity:0.07; }'
              ),
              (
                  '  .panel .why{',
                  "  .why-label{\n    margin:2px 0 7px;\n    color:var(--ink-faint);\n    font-size:10.5px;\n    font-weight:700;\n    letter-spacing:0.12em;\n    text-transform:uppercase;\n  }\n  .panel .why{"
              ),
              (
                  '  document.getElementById(\'panelPointIdx\').textContent = "POINT · " + currentPoint.category.toUpperCase();',
                  "  document.getElementById('panelPointIdx').textContent = currentPoint.category.toUpperCase();"
              ),
              (
                  '  document.getElementById(\'panelPointName\').textContent = currentPoint.name + " · " + currentPoint.sub;',
                  "  document.getElementById('panelPointName').textContent = currentPoint.name;"
              ),
              (
                  "  document.getElementById('panelMeridian').textContent = currentPoint.category;",
                  "  document.getElementById('panelMeridian').textContent = currentPoint.sub;"
              ),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Missing expected source snippet: {old[:90]!r}')
              s = s.replace(old, new, 1)

          why_pattern = r'(?P<indent>\s*)<div class="why" id="panelWhy"></div>'
          m = re.search(why_pattern, s)
          if not m:
              raise SystemExit('Could not find panelWhy block')
          indent = m.group('indent')
          s = re.sub(
              why_pattern,
              lambda m: f'{m.group("indent")}<div class="why-label">Why this point</div>\n{m.group("indent")}<div class="why" id="panelWhy"></div>',
              s,
              count=1,
          )

          path.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit polished app
        run: |
          rm .github/workflows/apply-visual-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-visual-polish.yml
          git commit -m "Polish Points orientation and interface copy"
          git push
