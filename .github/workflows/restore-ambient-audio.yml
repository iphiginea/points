name: Restore ambient Points audio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-ambient-audio.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore ambient audio only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          def replace_once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "<div class=\"player-status\" id=\"curatedStatus\">Each passage appears at a gentle pace</div>",
              "<div class=\"player-status\" id=\"curatedStatus\">A soft chime marks each new passage</div>",
          )

          replace_once(
              "/* ============ BREATHING VISUAL ============ */",
              "/* ============ BREATHING VISUAL + SOUND ============ */",
          )

          replace_once(
              "    label.textContent = 'Breathe in';\n  }else if(breathPhase === 'hold')",
              "    label.textContent = 'Breathe in';\n    playBreathSound('in', durMs / 1000);\n  }else if(breathPhase === 'hold')",
          )

          replace_once(
              "    label.textContent = 'Breathe out';\n  }\n\n  breathTimer = setTimeout",
              "    label.textContent = 'Breathe out';\n    playBreathSound('out', durMs / 1000);\n  }\n\n  breathTimer = setTimeout",
          )

          ambient = r'''/* ============ AMBIENT CHIME (Web Audio) ============ */
let audioCtx;

function chime(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1100;
    filter.Q.value = 0.3;
    filter.connect(audioCtx.destination);

    // A soft open fifth (A3 + E4), like a distant singing bowl rather than a UI ding
    [220.0, 329.63].forEach((freq)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.045, now + 1.2);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 4.5);
      osc.connect(gain).connect(filter);
      osc.start(now);
      osc.stop(now + 4.7);
    });
  }catch(e){ /* audio unavailable — reveal still proceeds silently */ }
}

let breathNoiseBuffer;
function getNoiseBuffer(ctx){
  if(!breathNoiseBuffer || breathNoiseBuffer.sampleRate !== ctx.sampleRate){
    const len = ctx.sampleRate * 6.5;
    breathNoiseBuffer = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = breathNoiseBuffer.getChannelData(0);
    for(let i = 0; i < len; i++){ data[i] = Math.random() * 2 - 1; }
  }
  return breathNoiseBuffer;
}
function playBreathSound(direction, durSeconds){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const dur = durSeconds || 4;

    const source = audioCtx.createBufferSource();
    source.buffer = getNoiseBuffer(audioCtx);

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.6;
    if(direction === 'in'){
      filter.frequency.setValueAtTime(320, now);
      filter.frequency.linearRampToValueAtTime(680, now + dur);
    }else{
      filter.frequency.setValueAtTime(680, now);
      filter.frequency.linearRampToValueAtTime(320, now + dur);
    }

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.008, now + dur * 0.45);
    gain.gain.linearRampToValueAtTime(0, now + dur);

    source.connect(filter).connect(gain).connect(audioCtx.destination);
    source.start(now);
    source.stop(now + dur + 0.05);
  }catch(e){ /* audio unavailable — breathing visual still proceeds silently */ }
}

'''

          replace_once(
              "/* ============ PACED TEXT SESSION PLAYER ============ */",
              ambient + "/* ============ PACED TEXT SESSION PLAYER ============ */",
          )

          replace_once(
              "    showReflection();\n    return;\n  }\n  const p = document.createElement('p');",
              "    showReflection();\n    return;\n  }\n  chime();\n  const p = document.createElement('p');",
          )

          # Shén Mén narration intentionally stays removed. There is no sessionAudio element,
          # no audio property on Shén Mén, and no narration MP3 in the repository.
          if 'audio/shenmen.mp3' in text or 'sessionAudio' in text:
              raise SystemExit('Narration code unexpectedly present')

          path.write_text(text)
          PY

          rm .github/workflows/restore-ambient-audio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-ambient-audio.yml
          git commit -m "Restore Points ambient audio only"
          git push