name: Force Points v12 cache refresh

on:
  push:
    paths:
      - '.github/workflows/force-points-v12.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version service worker and session experience
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('service-worker.js')
          s = p.read_text()
          s = s.replace("const CACHE_NAME = 'points-shell-v11';", "const CACHE_NAME = 'points-shell-v12';")
          s = s.replace("const SHELL_FILES = ['./', './index.html', './manifest.json', './session-copy.js'];", "const SHELL_FILES = ['./', './index.html', './manifest.json', './session-copy.js?v=12'];")
          s = s.replace("'<script src=\"./session-copy.js\"></script>\\n</body>'", "'<script src=\"./session-copy.js?v=12\"></script>\\n</body>'")
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/force-points-v12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js .github/workflows/force-points-v12.yml
          git commit -m "Force Points v12 session refresh"
          git push
