name: Apply Points v15 cache bump

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/points-v15-cache.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Points cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('service-worker.js')
          s = p.read_text()
          s = s.replace("points-shell-v14", "points-shell-v15")
          s = s.replace("session-copy.js?v=14", "session-copy.js?v=15")
          s = s.replace("experience-v13.js?v=14", "experience-v13.js?v=15")
          p.write_text(s)
          PY
      - name: Commit cache bump
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js
          git commit -m "Bump Points reader to v15"
          git push
